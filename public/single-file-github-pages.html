<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trading Journal - Portafolio XAU/USD</title>
  <link rel="icon" type="image/jpeg" href="logo.jpg" />
  <link rel="apple-touch-icon" href="logo.jpg" />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bgDark: '#0B0D12',
            goldAccent: '#E0B341',
            profitGreen: '#34C97A',
            lossRed: '#FF6B60',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['Space Grotesk', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #0B0D12;
      color: #EDEDED;
      font-family: 'Inter', sans-serif;
    }
    h1, h2, h3, h4, .font-heading {
      font-family: 'Space Grotesk', sans-serif;
    }
    .glass-panel {
      background: rgba(16, 20, 29, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-dropdown {
      background: rgba(13, 16, 24, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0B0D12; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(224, 179, 65, 0.5); }
  </style>
</head>
<body class="bg-[#0B0D12] text-[#EDEDED] antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbybx6mAa-PXrkia4ZdRe1xslt2q1QzKpqgtkpKHeb7ZtE--dFgL1jetmkbivg8dMwG-oA/exec';
    const OWNER_KEY_STORAGE = 'trading_journal_owner_key';

    function parseTrade(raw, idx) {
      const entrada = Number(raw.ENTRADA) || 0;
      const sl = Number(raw.SL) || 0;
      const tp = Number(raw.TP) || 0;
      const money = Number(raw.MONEY) || 0;
      
      let direccion = 'Buy';
      const rawDir = String(raw.DIRECCION || '').trim().toLowerCase();
      if (rawDir === 'buy' || rawDir === 'compra') {
        direccion = 'Buy';
      } else if (rawDir === 'sell' || rawDir === 'venta') {
        direccion = 'Sell';
      } else {
        direccion = sl < entrada ? 'Buy' : 'Sell';
      }

      let salida = null;
      if (raw.SALIDA !== undefined && raw.SALIDA !== null && String(raw.SALIDA).trim() !== '') {
        const pSalida = Number(raw.SALIDA);
        if (!isNaN(pSalida)) salida = pSalida;
      }

      const risk = Math.abs(entrada - sl);
      const reward = Math.abs(tp - entrada);
      const rr = risk > 0 ? Math.round((reward / risk) * 100) / 100 : 0;
      
      let rReal = null;
      if (salida !== null && !isNaN(salida) && risk > 0) {
        const mult = direccion === 'Buy' ? 1 : -1;
        const calcR = ((salida - entrada) * mult) / risk;
        if (!isNaN(calcR) && isFinite(calcR)) {
          rReal = Math.round(calcR * 100) / 100;
        }
      }

      const rawImg = String(raw.IMAGEN || '').trim();
      let imageUrl = '';
      if (rawImg) {
        imageUrl = rawImg.startsWith('http') ? rawImg : `https://drive.google.com/thumbnail?id=${encodeURIComponent(rawImg)}&sz=w1600`;
      }
      let fecha = '';
      if (raw.FECHA) {
        const rawFechaStr = String(raw.FECHA).trim();
        const dateOnly = rawFechaStr.split('T')[0].split(' ')[0];
        const parts = dateOnly.split(/[-/]/);
        if (parts.length === 3) {
          fecha = `${parts[0]}-${parts[1].padStart(2, '0')}-${parts[2].padStart(2, '0')}`;
        } else {
          fecha = dateOnly;
        }
      }

      return {
        id: String(raw.ID || `T-${idx + 1}`),
        fecha,
        activo: String(raw.ACTIVO || 'XAU/USD').toUpperCase(),
        entrada, salida, sl, tp, money,
        setup: String(raw.SETUP || 'General'),
        sesion: String(raw.SESION || 'Nueva York'),
        emotion: String(raw.EMOTION || 'Calmado'),
        leccion: String(raw.LECCION || ''),
        imagen: rawImg,
        imageUrl,
        direccion,
        rrPlanificado: rr,
        rReal
      };
    }

    async function resizeImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('No se pudo leer la imagen'));
        reader.onload = (e) => {
          const img = new Image();
          img.onerror = () => reject(new Error('Formato no soportado'));
          img.onload = () => {
            const maxWidth = 1600;
            let w = img.width, h = img.height;
            if (w > maxWidth) {
              h = Math.round(h * (maxWidth / w));
              w = maxWidth;
            }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
            resolve({
              base64Data: dataUrl.replace(/^data:image\/[a-z]+;base64,/, ''),
              previewUrl: dataUrl
            });
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function App() {
      const [trades, setTrades] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [ownerKey, setOwnerKey] = useState(localStorage.getItem(OWNER_KEY_STORAGE) || '');
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [showNewTradeModal, setShowNewTradeModal] = useState(false);
      const [selectedTrade, setSelectedTrade] = useState(null);
      const [toast, setToast] = useState(null);

      const isOwner = Boolean(ownerKey);

      const triggerToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 4000);
      };

      const loadTrades = useCallback(async () => {
        setLoading(true);
        setError(null);
        try {
          const res = await fetch(APPS_SCRIPT_URL);
          if (!res.ok) {
            const errTxt = await res.text().catch(() => '');
            throw new Error(`HTTP ${res.status} (${res.statusText}): ${errTxt.slice(0, 200) || 'Error en servidor'}`);
          }
          const text = await res.text();
          if (!text || !text.trim()) {
            setTrades([]);
            return;
          }
          const data = JSON.parse(text);
          let rawList = [];
          if (Array.isArray(data)) {
            rawList = data;
          } else if (data && typeof data === 'object' && Array.isArray(data.trades)) {
            rawList = data.trades;
          } else if (data && data.error) {
            throw new Error(`Apps Script: ${data.error}`);
          }

          // Deduplicate trades created by edits
          const groups = new Map();
          rawList.forEach((item, index) => {
            const activo = String(item.ACTIVO || '').trim().toUpperCase();
            const entrada = Number(item.ENTRADA || 0).toFixed(2);
            const sl = Number(item.SL || 0).toFixed(2);
            const tp = Number(item.TP || 0).toFixed(2);
            const setup = String(item.SETUP || '').trim().toLowerCase();
            const key = `${activo}___${entrada}___${sl}___${tp}___${setup}`;
            if (!groups.has(key)) groups.set(key, []);
            groups.get(key).push({ item, index });
          });

          const deduplicated = [];
          groups.forEach((group) => {
            if (group.length === 1) {
              deduplicated.push(group[0].item);
            } else {
              const imgCandidate = group.find(g => g.item.IMAGEN && String(g.item.IMAGEN).trim() !== '');
              const bestImg = imgCandidate ? imgCandidate.item.IMAGEN : '';
              const latest = group[group.length - 1].item;
              deduplicated.push({
                ...latest,
                IMAGEN: latest.IMAGEN && String(latest.IMAGEN).trim() !== '' ? latest.IMAGEN : bestImg
              });
            }
          });

          setTrades(deduplicated.map(parseTrade));
        } catch (err) {
          setError(err.message || 'Error al conectar');
        } finally {
          setLoading(false);
        }
      }, []);

      useEffect(() => { loadTrades(); }, [loadTrades]);

      // Metrics
      const metrics = useMemo(() => {
        if (!trades.length) return { total: 0, wins: 0, winRate: 0, net: 0, pf: 0, rr: 0, avgRealR: null, best: null, worst: null };
        let wins = 0, grossWin = 0, grossLoss = 0, totalRR = 0, countRR = 0, totalRealR = 0, countRealR = 0;
        let best = null, worst = null;
        trades.forEach(t => {
          if (t.money > 0) { wins++; grossWin += t.money; }
          else if (t.money < 0) { grossLoss += Math.abs(t.money); }
          if (t.rrPlanificado > 0) { totalRR += t.rrPlanificado; countRR++; }
          if (t.rReal !== null && !isNaN(t.rReal)) { totalRealR += t.rReal; countRealR++; }
          if (!best || t.money > best.money) best = t;
          if (!worst || t.money < worst.money) worst = t;
        });
        const net = grossWin - grossLoss;
        const winRate = (wins / trades.length) * 100;
        const pf = grossLoss > 0 ? grossWin / grossLoss : (grossWin > 0 ? 99.9 : 0);
        const rr = countRR > 0 ? totalRR / countRR : 0;
        const avgRealR = countRealR > 0 ? totalRealR / countRealR : null;
        return { total: trades.length, wins, winRate, net, pf, rr, avgRealR, best, worst };
      }, [trades]);

      // Equity points
      const equityPoints = useMemo(() => {
        if (!trades.length) return [];
        const sorted = [...trades].sort((a,b) => new Date(a.fecha) - new Date(b.fecha));
        let sum = 0;
        return sorted.map((t, idx) => {
          sum += t.money;
          return { idx: idx + 1, fecha: t.fecha, money: t.money, equity: sum, trade: t };
        });
      }, [trades]);

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="sticky top-0 z-30 border-b border-white/[0.08] bg-[#0B0D12]/90 backdrop-blur-md">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 h-16 sm:h-20 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="relative w-8 h-8 sm:w-9 sm:h-9 rounded-xl overflow-hidden ring-1 ring-[#E0B341]/40 shadow-md shadow-[#E0B341]/10 bg-[#12151D] flex items-center justify-center shrink-0">
                  <img
                    src="logo.jpg"
                    alt="Logo"
                    className="w-full h-full object-cover"
                    onError={(e) => { e.currentTarget.style.display = 'none'; }}
                  />
                  <span className="font-bold text-xs text-[#E0B341] absolute -z-10">AU</span>
                </div>
                <h1 className="font-heading font-bold text-lg sm:text-xl text-white">
                  Trading Journal <span className="text-xs text-[#E0B341] font-mono px-1.5 py-0.5 rounded bg-[#E0B341]/10 border border-[#E0B341]/20">XAU/USD</span>
                </h1>
              </div>

              <div className="flex items-center gap-2">
                <button onClick={loadTrades} className="px-3 py-1.5 text-xs rounded-xl bg-white/[0.04] text-neutral-300 hover:text-white border border-white/[0.08]">
                  {loading ? 'Cargando...' : 'Actualizar'}
                </button>
                {isOwner ? (
                  <>
                    <button onClick={() => setShowNewTradeModal(true)} className="px-3.5 py-1.5 text-xs font-bold rounded-xl bg-[#E0B341] text-[#0B0D12] hover:brightness-110">
                      + Nuevo trade
                    </button>
                    <button onClick={() => { localStorage.removeItem(OWNER_KEY_STORAGE); setOwnerKey(''); triggerToast('Modo dueño desactivado'); }} className="px-2.5 py-1.5 text-xs rounded-xl bg-red-500/10 text-red-400 hover:bg-red-500/20">
                      Salir
                    </button>
                  </>
                ) : (
                  <button onClick={() => setShowAuthModal(true)} className="px-3 py-1.5 text-xs rounded-xl bg-white/[0.04] text-neutral-400 hover:text-[#E0B341] border border-white/[0.08]">
                    Modo dueño
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* Toast */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 p-3 rounded-2xl glass-dropdown border border-[#E0B341]/40 text-xs text-white">
              {toast}
            </div>
          )}

          {/* Main Content */}
          <main className="max-w-7xl mx-auto px-4 sm:px-6 py-6 flex-1 w-full space-y-6">
            {error && (
              <div className="p-4 rounded-2xl bg-[#FF6B60]/10 border border-[#FF6B60]/30 text-xs text-[#FF6B60] flex justify-between items-center">
                <span>{error}</span>
                <button onClick={loadTrades} className="underline">Reintentar</button>
              </div>
            )}

            {/* Hero Net Profit */}
            <div className="glass-panel p-6 sm:p-8 rounded-3xl relative overflow-hidden">
              <div className="flex flex-col lg:flex-row justify-between gap-6">
                <div>
                  <span className="text-xs text-[#E0B341] font-mono uppercase tracking-widest">Resultado Neto Acumulado</span>
                  <div className={`font-heading text-4xl sm:text-6xl font-bold tracking-tight mt-1 tabular-nums ${metrics.net >= 0 ? 'text-[#34C97A]' : 'text-[#FF6B60]'}`}>
                    {metrics.net >= 0 ? '+' : '-'}${Math.abs(metrics.net).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
                  </div>
                  <p className="text-xs text-neutral-400 mt-2 max-w-lg">
                    Portafolio cuantitativo y diario institucional de oro spot (XAU/USD).
                  </p>
                </div>

                <div className="grid grid-cols-2 gap-3 sm:w-96 shrink-0">
                  <div className="p-3.5 rounded-2xl bg-white/[0.03] border border-white/[0.06]">
                    <span className="text-[11px] text-neutral-400 block">Win Rate</span>
                    <span className="font-heading text-xl font-bold text-white tabular-nums">{!trades.length ? '—' : `${metrics.winRate.toFixed(1)}%`}</span>
                  </div>
                  <div className="p-3.5 rounded-2xl bg-white/[0.03] border border-white/[0.06]">
                    <span className="text-[11px] text-neutral-400 block">Profit Factor</span>
                    <span className="font-heading text-xl font-bold text-[#E0B341] tabular-nums">{!trades.length ? '—' : metrics.pf.toFixed(2)}</span>
                  </div>
                  <div className="p-3.5 rounded-2xl bg-white/[0.03] border border-white/[0.06]">
                    <span className="text-[11px] text-neutral-400 block">R Real Promedio</span>
                    <span className={`font-heading text-xl font-bold tabular-nums ${metrics.avgRealR === null ? 'text-neutral-400' : metrics.avgRealR >= 0 ? 'text-[#34C97A]' : 'text-[#FF6B60]'}`}>
                      {metrics.avgRealR === null ? '—' : `${metrics.avgRealR >= 0 ? '+' : ''}${metrics.avgRealR.toFixed(2)}R`}
                    </span>
                  </div>
                  <div className="p-3.5 rounded-2xl bg-white/[0.03] border border-white/[0.06]">
                    <span className="text-[11px] text-neutral-400 block">R:R Planeado</span>
                    <span className="font-heading text-xl font-bold text-neutral-200 tabular-nums">{!trades.length || metrics.rr === 0 ? '—' : `1:${metrics.rr.toFixed(2)}`}</span>
                  </div>
                  <div className="p-3.5 rounded-2xl bg-white/[0.03] border border-white/[0.06] col-span-2">
                    <span className="text-[11px] text-neutral-400 block">Trades Totales</span>
                    <span className="font-heading text-xl font-bold text-white tabular-nums">{metrics.total}</span>
                  </div>
                </div>
              </div>
            </div>

            {/* Calendario de Resultados */}
            <div className="glass-panel p-6 sm:p-8 rounded-3xl relative overflow-hidden space-y-4">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div>
                  <h3 className="font-heading text-lg sm:text-xl font-bold text-white">Calendario de Resultados</h3>
                  <p className="text-xs text-neutral-400 mt-0.5">Vista diaria de operaciones agrupadas por fecha</p>
                </div>
              </div>
            </div>

            {/* Trades Gallery */}
            <div className="space-y-4">
              <h2 className="font-heading text-xl font-bold text-white">Galería de Operaciones ({trades.length})</h2>
              {trades.length === 0 ? (
                <div className="p-12 text-center glass-panel rounded-3xl">
                  <h3 className="font-heading text-lg font-bold text-white">Tu diario está vacío</h3>
                  <p className="text-xs text-neutral-400 mt-1 mb-4">Aún no hay trades registrados en tu Google Sheets.</p>
                  {isOwner && (
                    <button onClick={() => setShowNewTradeModal(true)} className="px-4 py-2 text-xs font-bold rounded-xl bg-[#E0B341] text-[#0B0D12]">
                      + Registrar mi primer trade
                    </button>
                  )}
                </div>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                  {trades.map(t => (
                    <div key={t.id} onClick={() => setSelectedTrade(t)} className="glass-panel rounded-2xl overflow-hidden hover:border-[#E0B341]/40 cursor-pointer transition-all hover:-translate-y-1">
                      <div className="aspect-video bg-neutral-900 relative">
                        {t.imageUrl ? (
                          <img src={t.imageUrl} alt={t.setup || ''} className="w-full h-full object-cover" />
                        ) : (
                          <div className="w-full h-full flex items-center justify-center text-xs text-neutral-500">Sin gráfico</div>
                        )}
                        <span className={`absolute top-2 left-2 px-2 py-0.5 rounded text-[10px] font-bold ${t.direccion === 'Buy' ? 'bg-[#34C97A] text-black' : 'bg-[#FF6B60] text-white'}`}>
                          {t.direccion}
                        </span>
                        <div className="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/90 p-3 flex justify-between items-end">
                          <div>
                            <span className="text-[10px] font-mono text-neutral-400 block">{t.fecha || '—'}</span>
                            <span className="font-heading text-xs font-bold text-white block">{t.setup || '—'}</span>
                          </div>
                          <div className="text-right">
                            <span className={`font-heading text-base font-bold block ${t.money >= 0 ? 'text-[#34C97A]' : 'text-[#FF6B60]'}`}>
                              {t.money >= 0 ? '+' : ''}${t.money.toFixed(2)}
                            </span>
                            {t.rReal !== null && (
                              <span className={`text-[10px] font-mono font-bold ${t.rReal >= 0 ? 'text-[#34C97A]' : 'text-[#FF6B60]'}`}>
                                {t.rReal >= 0 ? '+' : ''}{t.rReal.toFixed(2)}R
                              </span>
                            )}
                          </div>
                        </div>
                      </div>
                      <div className="p-3 text-xs text-neutral-400 flex justify-between font-mono">
                        <span>In: {t.entrada ?? '—'}</span>
                        <span className="text-[#E0B341]">Out: {t.salida ?? '—'}</span>
                        <span>SL: {t.sl ?? '—'}</span>
                        <span>TP: {t.tp ?? '—'}</span>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </main>

          {/* Footer */}
          <footer className="border-t border-white/[0.06] py-6 text-center text-xs text-neutral-500">
            Diario personal con fines informativos. Resultados pasados no garantizan resultados futuros.
          </footer>

          {/* Auth Modal */}
          {showAuthModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="glass-dropdown p-6 rounded-3xl max-w-sm w-full space-y-4">
                <h3 className="font-heading text-lg font-bold text-white text-center">Clave Modo Dueño</h3>
                <input
                  type="password"
                  placeholder="Ingresa clave..."
                  id="ownerKeyInput"
                  className="w-full text-center bg-white/[0.04] text-white p-2.5 rounded-xl border border-white/[0.1]"
                />
                <div className="flex gap-2">
                  <button onClick={() => setShowAuthModal(false)} className="flex-1 py-2 text-xs rounded-xl bg-white/[0.04]">Cancelar</button>
                  <button onClick={() => {
                    const val = document.getElementById('ownerKeyInput').value.trim();
                    if (val) {
                      localStorage.setItem(OWNER_KEY_STORAGE, val);
                      setOwnerKey(val);
                      setShowAuthModal(false);
                      triggerToast('Modo dueño activado');
                    }
                  }} className="flex-1 py-2 text-xs font-bold rounded-xl bg-[#E0B341] text-[#0B0D12]">Activar</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
